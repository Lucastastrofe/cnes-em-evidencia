name: Atualizar dados e publicar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar os testes
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Obter e processar o CNES
        env:
          PYTHONPATH: src
        run: python -m cnes_audit.cli --code-version "$GITHUB_SHA"

      - name: Validar o JavaScript
        run: node --check site/app.js

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o mesmo site validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

