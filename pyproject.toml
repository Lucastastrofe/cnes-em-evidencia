[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnes-em-evidencia"
version = "0.1.0"
description = "Auditoria reproduzível dos dados abertos de estabelecimentos do CNES"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[project.scripts]
cnes-audit = "cnes_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cnes_audit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

